<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<title>Gym App — Prototipo</title>
<meta name="viewport" content="width=1600"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="tokens.css"/>
<style>
  html, body { background: #E8E6DF; }
  [data-theme="dark"] body, body[data-theme="dark"] { background: #08080A; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="browser-window.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="client-app.jsx"></script>
<script type="text/babel" src="owner-app.jsx"></script>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "dark": true
}/*EDITMODE-END*/;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const dark = tweaks.dark;

  React.useEffect(()=>{
    document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  }, [dark]);

  return (
    <React.Fragment>
      <DesignCanvas
        title="Forja — Prototipo de gym multi-sede"
        subtitle="Cliente móvil iOS · Owner web. Datos genéricos. ₡ Costa Rica.">
        <DCSection id="apps" title="Apps en paralelo" subtitle="Navega entre pantallas con la barra inferior (cliente) y la sidebar (owner)">
          <DCArtboard id="client" label="CLIENTE — iOS" width={460} height={920}>
            <div style={{padding:30, display:'flex', justifyContent:'center', background: dark?'#0A0A09':'#F2F0EA'}}>
              <IOSDevice width={400} height={860} dark={dark}>
                <ClientApp dark={dark}/>
              </IOSDevice>
            </div>
          </DCArtboard>

          <DCArtboard id="owner" label="OWNER — Web" width={1280} height={920}>
            <div style={{padding:24, background: dark?'#0A0A09':'#F2F0EA'}}>
              <ChromeWindow
                tabs={[{title:'Forja · Owner'}, {title:'Stripe Dashboard'}]}
                activeIndex={0}
                url="forja.app/owner/gym-1"
                width={1232} height={870}>
                <div style={{height:'100%', background:'var(--bg)'}}>
                  <OwnerApp/>
                </div>
              </ChromeWindow>
            </div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="Apariencia">
          <TweakToggle label="Modo oscuro" value={dark} onChange={v=>setTweak('dark', v)}/>
        </TweakSection>
        <TweakSection title="Tip">
          <div style={{fontSize:12, color:'#666', lineHeight:1.5}}>
            En la app cliente: pulsa <b>Empezar entreno</b> para ver el flujo de ejecución de rutina con timer, sets y reps. Navega con la barra inferior.
            <br/><br/>
            En el owner: usa la sidebar para cambiar entre Dashboard, Clientes, Rutinas y Pagos.
          </div>
        </TweakSection>
      </TweaksPanel>
    </React.Fragment>
  );
}

// Wait for all babel scripts to register globals
function tryMount() {
  if (typeof DesignCanvas==='undefined' || typeof IOSDevice==='undefined' ||
      typeof ChromeWindow==='undefined' || typeof TweaksPanel==='undefined' ||
      typeof useTweaks==='undefined' || typeof ClientApp==='undefined' ||
      typeof OwnerApp==='undefined' || typeof ICON==='undefined') {
    return setTimeout(tryMount, 60);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
}
tryMount();
</script>
</body>
</html>
