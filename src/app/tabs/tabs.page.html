<ion-tabs>

  <ion-tab-bar slot="bottom" [class.tab-bar-hidden]="!showTabBar">

    <ion-tab-button tab="inicio" href="/tabs/inicio">
      <ion-icon name="home-outline" [name]="'home-outline'"></ion-icon>
      <ion-label>Inicio</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="rutinas" href="/tabs/rutinas">
      <ion-icon name="barbell-outline"></ion-icon>
      <ion-label>Rutinas</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="progreso" href="/tabs/progreso">
      <ion-icon name="stats-chart-outline"></ion-icon>
      <ion-label>Progreso</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="agenda" href="/tabs/agenda">
      <ion-icon name="calendar-outline"></ion-icon>
      <ion-label>Agenda</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="perfil" href="/tabs/perfil">
      <ion-icon name="person-outline"></ion-icon>
      <ion-label>Perfil</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
