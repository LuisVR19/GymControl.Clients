<ion-content class="auth-content">
  <div class="auth-wrap">

    <div class="auth-brand">
      <div class="auth-brand__row">
        <div class="auth-brand__logo-wrap">
          <img class="auth-brand__logo" src="assets/icon.png" alt="MyGymGo" />
        </div>
        <div class="auth-brand__text">
          <h1 class="auth-brand__name">MyGymGo</h1>
          <p class="auth-brand__sub">Crear tu cuenta</p>
        </div>
      </div>
    </div>

    <form [formGroup]="form" (ngSubmit)="register()">

      <div class="field">
        <label class="field__label">Cédula</label>
        <input class="field__input"
               type="text"
               formControlName="cedula"
               autocomplete="off"
               inputmode="numeric"
               placeholder="Ej. 1234567890">
      </div>

      <div class="field">
        <label class="field__label">Correo electrónico</label>
        <input class="field__input"
               type="email"
               formControlName="email"
               autocomplete="email"
               inputmode="email"
               placeholder="tu@correo.com">
      </div>

      <div class="field">
        <label class="field__label">Contraseña</label>
        <div class="field__row">
          <input class="field__input"
                 [type]="showPassword ? 'text' : 'password'"
                 formControlName="password"
                 autocomplete="new-password"
                 placeholder="Mínimo 6 caracteres">
          <button type="button" class="field__toggle" (click)="showPassword = !showPassword" aria-label="Mostrar contraseña">
            <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </button>
        </div>
      </div>

      <button type="submit" class="btn-primary btn-accent btn-full" [disabled]="loading || form.invalid">
        <ion-spinner *ngIf="loading" name="crescent" style="width:20px;height:20px;"></ion-spinner>
        <span *ngIf="!loading">Crear cuenta</span>
      </button>

    </form>

    <p class="auth-footer">
      ¿Ya tienes cuenta?
      <button class="auth-footer__link" type="button" (click)="goToLogin()">Inicia sesión</button>
    </p>

  </div>
</ion-content>
