<ion-content [fullscreen]="true">

  <!-- Navbar -->
  <div class="navbar">
    <button class="btn-icon btn-icon--sunk" (click)="goBack()" aria-label="Volver">
      <ion-icon name="arrow-back-outline"></ion-icon>
    </button>
    <p class="label-mono" style="margin: 0;">Notificaciones</p>
    <div style="display:flex;align-items:center;gap:8px;">
      <app-gym-badge></app-gym-badge>
      <button class="navbar__action" (click)="markAllRead()" [disabled]="unreadCount === 0">
        Marcar todas
      </button>
    </div>
  </div>

  <!-- Filter pills -->
  <div class="filter-tabs">
    <button *ngFor="let f of filters"
            class="filter-tab"
            [class.filter-tab--active]="activeFilter === f.id"
            (click)="activeFilter = f.id">
      {{ f.label }}
    </button>
  </div>

  <!-- Skeleton -->
  <div class="notif-list" *ngIf="loading">
    <div *ngFor="let i of [1,2,3]" class="card notif-card notif-card--skeleton">
      <div class="sk sk--avatar" style="width:42px;height:42px;border-radius:50%;flex-shrink:0;"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
        <div class="sk" style="height:10px;width:60px;border-radius:5px;"></div>
        <div class="sk" style="height:13px;width:160px;border-radius:5px;"></div>
        <div class="sk" style="height:10px;width:220px;border-radius:5px;"></div>
      </div>
    </div>
  </div>

  <!-- Notification list -->
  <div class="notif-list" *ngIf="!loading">

    <!-- Empty state -->
    <div class="empty-state" *ngIf="filtered.length === 0">
      <ion-icon name="notifications-off-outline" class="empty-state__icon"></ion-icon>
      <p class="empty-state__text">No hay notificaciones</p>
    </div>

    <!-- Cards -->
    <div *ngFor="let n of filtered"
         class="card notif-card notif-card--unread">

      <!-- Avatar with category dot -->
      <div class="notif-card__avatar-wrap">
        <app-avatar [name]="n.from" [size]="42" [avatarUrl]="n.avatarUrl"></app-avatar>
        <div class="notif-card__cat-dot" [style.background]="catTone(n.cat).dot"></div>
      </div>

      <!-- Content -->
      <div class="notif-card__body">

        <!-- Category pill + timestamp -->
        <div class="notif-card__meta">
          <span class="cat-pill" [style.background]="catTone(n.cat).bg">
            <span class="cat-pill__dot" [style.background]="catTone(n.cat).dot"></span>
            {{ catTone(n.cat).label }}
          </span>
          <span class="notif-card__time">{{ n.t }}</span>
        </div>

        <!-- Title -->
        <p class="notif-card__title notif-card__title--unread">{{ n.title }}</p>

        <!-- Description -->
        <p class="notif-card__desc">{{ n.desc }}</p>

        <!-- Sender -->
        <p class="notif-card__from">DE · {{ n.from }}</p>

      </div>

      <!-- Mark as read button -->
      <button class="notif-card__read-btn" (click)="markRead(n.id)" aria-label="Marcar como leída">
        <ion-icon name="checkmark-outline"></ion-icon>
      </button>

    </div>

  </div>

</ion-content>
